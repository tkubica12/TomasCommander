[package]
name = "tomas-commander"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Keyboard-first native Windows file workspace"

[features]
native-search-tests = []
native-answer-tests = []
native-desktop-tests = ["native-answer-tests"]

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
crc32fast = "=1.5.2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2"] }
egui_commonmark = { version = "=0.25.0", default-features = false, features = ["pulldown_cmark"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
scraper = { version = "=0.27.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = ["Data_Pdf", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
